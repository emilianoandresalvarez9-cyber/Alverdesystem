<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9faf6" />
    <title>Alverde · Stock</title>
  <script>
      (function(){
        try {
          var t = localStorage.getItem("alverde-tema");
          var valid = t === "midnight-bio" ? "midnight-bio" : "alverde-botanical";
          document.documentElement.setAttribute("data-theme", valid);
          var c = {"alverde-botanical":"#f9faf6","midnight-bio":"#101410"};
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", c[valid]);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/stock.tsx"></script>
  </body>
</html>
