name: Verificación

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compuerta de calidad (tests vacíos, .only, mocks nuevos)
        run: npm run qa:guard
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Las migraciones existentes no se editan
        run: bash scripts/check-migrations-immutable.sh "origin/${{ github.base_ref }}"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      # Aplica todas las migraciones y seed.sql sobre una base limpia.
      - run: supabase db start
      # pg_prove devuelve código de salida distinto de 0 si falla cualquier test.
      # (El job anterior usaba `psql -f`, que devuelve 0 aunque los tests fallen.)
      - run: supabase test db
